<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>C3 | User Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00f0ff;
            --primary-dark: #00cce0;
            --primary-glow: rgba(0, 240, 255, 0.4);
            --secondary: #ff2d75;
            --secondary-dark: #e6005c;
            --secondary-glow: rgba(255, 45, 117, 0.4);
            --accent: #f0ff00;
            --text: #ffffff;
            --text-dark: #1a1a2e;
            --text-secondary: #a0a0b0;
            --text-tertiary: #6b6b7a;
            --bg: #0a0e17;
            --bg-deep: #05070a;
            --card-bg: rgba(20, 25, 40, 0.7);
            --card-bg-solid: #141928;
            --glass-bg: rgba(15, 20, 35, 0.6);
            --glass-border: rgba(0, 240, 255, 0.15);
            --glass-border-light: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gradient-1: linear-gradient(135deg, #00f0ff 0%, #ff2d75 100%);
            --gradient-2: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-3: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-4: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-gold: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.4);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px rgba(0, 240, 255, 0.3);
            --shadow-glow-pink: 0 0 30px rgba(255, 45, 117, 0.3);
            --border-radius-sm: 12px;
            --border-radius-md: 18px;
            --border-radius-lg: 24px;
            --border-radius-xl: 32px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --primary: #0066ff;
            --primary-dark: #0052cc;
            --primary-glow: rgba(0, 102, 255, 0.2);
            --secondary: #ff3366;
            --secondary-dark: #e6004d;
            --text: #1a1a2e;
            --text-secondary: #4a4a5a;
            --text-tertiary: #8a8a9a;
            --bg: #f0f4ff;
            --bg-deep: #e8edf5;
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-bg-solid: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 102, 255, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 20px rgba(0, 102, 255, 0.15);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Grid */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-image: linear-gradient(var(--glass-border) 1px, transparent 1px), linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        /* Animated Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            animation: orbFloat 15s ease-in-out infinite;
        }

        .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -100px; right: -100px; animation-delay: 0s; }
        .orb-2 { width: 350px; height: 350px; background: var(--secondary); bottom: -80px; left: -80px; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: var(--accent); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -10s; opacity: 0.15; }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
        }

        .sidebar-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gradient-1);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1rem;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: var(--gradient-1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon i { font-size: 1.4rem; color: white; }

        .logo-text h3 { font-size: 1.1rem; font-family: 'Orbitron', sans-serif; background: var(--gradient-1); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo-text p { font-size: 0.65rem; color: var(--text-secondary); }

        .user-welcome {
            margin-top: 0.8rem;
            padding: 0.6rem;
            background: rgba(0, 240, 255, 0.05);
            border-radius: var(--border-radius-sm);
            border-left: 3px solid var(--primary);
        }

        .user-welcome p { font-size: 0.7rem; color: var(--text-secondary); }
        .user-welcome h4 { font-size: 0.9rem; font-weight: 600; color: var(--primary); }

        .tablink {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            width: 90%;
            margin: 0 auto 0.5rem;
            padding: 0.8rem 1rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: var(--border-radius-md);
            transition: all 0.3s ease;
        }

        .tablink i { width: 22px; font-size: 1rem; }

        .tablink:hover {
            color: var(--primary);
            background: rgba(0, 240, 255, 0.08);
            transform: translateX(5px);
        }

        .tablink.active {
            color: var(--primary);
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.15), transparent);
        }

        .tablink.active::before {
            content: '';
            position: absolute;
            left: 5%;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            background: var(--gradient-1);
            border-radius: 0 3px 3px 0;
        }

        .logout-btn {
            margin-top: 1.5rem;
            border-top: 1px solid var(--glass-border);
            border-radius: 0;
            width: 100%;
            color: var(--danger);
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            transform: translateX(0);
        }

        /* Main Content */
        .content {
            flex: 1;
            margin-left: 280px;
            padding: 1.5rem;
            transition: all 0.4s ease;
            width: calc(100% - 280px);
            max-width: 100%;
            overflow-x: hidden;
        }

        /* Hero Banner */
        .hero-banner {
            background: var(--gradient-1);
            border-radius: var(--border-radius-xl);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .hero-content { position: relative; z-index: 1; }
        .hero-content h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.3rem; }
        .hero-content p { opacity: 0.9; font-size: 0.85rem; }

        .stats-rail {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.15);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            font-size: 0.75rem;
        }

        .stat-pill i { font-size: 0.8rem; }
        .stat-pill span { font-weight: 700; font-size: 0.9rem; }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 0.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: 0.5rem;
            border-radius: 60px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            border: 1px solid var(--glass-border);
        }

        .tab-btn {
            padding: 0.5rem 1.2rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab-btn:hover { color: var(--primary); }
        .tab-btn.active { background: var(--gradient-1); color: white; box-shadow: var(--shadow-glow); }

        .tabcontent { display: none; animation: fadeInUp 0.4s ease; }
        .tabcontent.active { display: block; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Event Cards */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.2rem;
        }

        .event-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
            cursor: pointer;
        }

        .event-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: var(--shadow-glow); }

        .event-img {
            position: relative;
            height: 170px;
            overflow: hidden;
        }

        .event-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .event-card:hover .event-img img { transform: scale(1.05); }

        .event-badge {
            position: absolute;
            top: 0.8rem;
            right: 0.8rem;
            background: var(--gradient-1);
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 600;
        }

        .event-info { padding: 1rem; }
        .event-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--primary); }
        .event-date, .event-location {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin: 0.3rem 0;
        }

        /* Profile Card */
        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius-xl);
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        .profile-cover { height: 100px; background: var(--gradient-1); }
        
        .profile-avatar {
            width: 80px;
            height: 80px;
            background: var(--card-bg-solid);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -40px auto 0.8rem;
            border: 3px solid var(--primary);
            box-shadow: var(--shadow-md);
        }

        .profile-avatar i { font-size: 2.5rem; color: var(--primary); }

        .profile-info { text-align: center; padding: 0 1rem 1.2rem; }
        .profile-info h2 { font-size: 1.2rem; margin-bottom: 0.2rem; }
        .profile-info .email { color: var(--text-secondary); font-size: 0.75rem; margin-bottom: 1rem; }

        .profile-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }

        .profile-stat-item {
            text-align: center;
            padding: 0.7rem;
            background: rgba(0, 240, 255, 0.05);
            border-radius: var(--border-radius-sm);
        }

        .profile-stat-item .value { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
        .profile-stat-item .label { font-size: 0.65rem; color: var(--text-secondary); }

        .profile-details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
            padding: 0 1rem 1.2rem;
        }

        .profile-detail-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--border-radius-sm);
        }

        .profile-detail-item i {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 240, 255, 0.1);
            border-radius: 50%;
            color: var(--primary);
            font-size: 0.8rem;
        }

        .profile-detail-item .detail-label { font-size: 0.6rem; color: var(--text-secondary); }
        .profile-detail-item .detail-value { font-weight: 600; font-size: 0.75rem; }

        /* Certificates */
        .certificates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .certificate-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius-lg);
            padding: 1.2rem;
            text-align: center;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .certificate-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: var(--shadow-glow); }
        .certificate-icon { font-size: 2.5rem; color: var(--primary); margin-bottom: 0.8rem; }
        .certificate-card h3 { font-size: 0.95rem; margin-bottom: 0.3rem; }

        /* Notifications */
        .notifications-container { display: flex; flex-direction: column; gap: 0.8rem; }
        .notification-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-radius: var(--border-radius-md);
            border-left: 3px solid var(--primary);
            transition: all 0.3s ease;
        }
        .notification-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 0.2rem; color: var(--primary); }
        .notification-date { font-size: 0.65rem; opacity: 0.6; margin-bottom: 0.3rem; }

        /* Table */
        .table-container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius-lg);
            overflow-x: auto;
            border: 1px solid var(--glass-border);
        }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 0.8rem; text-align: left; border-bottom: 1px solid var(--glass-border); font-size: 0.75rem; }
        th { background: rgba(0, 240, 255, 0.05); color: var(--primary); font-weight: 600; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card-bg-solid);
            border-radius: var(--border-radius-xl);
            padding: 1.5rem;
            max-width: 90%;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            animation: modalIn 0.3s ease;
            margin: 1rem;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .close-modal {
            float: right;
            font-size: 1.3rem;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .close-modal:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1.2rem;
            background: var(--gradient-1);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-glow); }

        .online-badge {
            color: var(--success);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .online-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
            animation: pulseDot 1.5s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .loading-spinner { text-align: center; padding: 2rem; color: var(--text-secondary); }
        .empty-state { text-align: center; padding: 2rem; color: var(--text-secondary); }

        /* Mobile Menu */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 0.8rem;
            left: 0.8rem;
            z-index: 102;
            background: var(--gradient-1);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: var(--shadow-md);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 99;
        }

        /* ========== RESPONSIVE STYLES - FIXED ========== */
        
        /* Tablet */
        @media (max-width: 992px) {
            .mobile-menu-toggle { display: flex; align-items: center; justify-content: center; }
            .sidebar {
                transform: translateX(-100%);
                position: fixed;
                width: 260px;
                z-index: 103;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.active { display: block; }
            .content {
                margin-left: 0;
                padding: 1rem;
                padding-top: 4.5rem;
                width: 100%;
            }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .content { padding: 0.8rem; padding-top: 4.5rem; }
            
            .hero-banner { padding: 1rem; border-radius: 20px; }
            .hero-content h1 { font-size: 1.1rem; }
            .hero-content p { font-size: 0.7rem; }
            
            .stat-pill { padding: 0.3rem 0.7rem; font-size: 0.65rem; }
            .stat-pill i { font-size: 0.7rem; }
            .stat-pill span { font-size: 0.8rem; }
            
            .tab-nav {
                overflow-x: auto;
                flex-wrap: nowrap;
                border-radius: 40px;
                padding: 0.4rem;
                gap: 0.3rem;
                -webkit-overflow-scrolling: touch;
            }
            .tab-btn {
                white-space: nowrap;
                padding: 0.4rem 1rem;
                font-size: 0.7rem;
            }
            
            .events-grid { grid-template-columns: 1fr; gap: 1rem; }
            .event-img { height: 150px; }
            .event-title { font-size: 0.9rem; }
            
            .certificates-grid { grid-template-columns: 1fr; gap: 1rem; }
            
            .profile-stats-grid { gap: 0.5rem; }
            .profile-stat-item .value { font-size: 1.1rem; }
            .profile-details-grid { grid-template-columns: 1fr; gap: 0.5rem; padding: 0 0.8rem 1rem; }
            .profile-detail-item { padding: 0.5rem; }
            
            .profile-avatar { width: 70px; height: 70px; margin-top: -35px; }
            .profile-avatar i { font-size: 2rem; }
            .profile-info h2 { font-size: 1rem; }
            .profile-info .email { font-size: 0.65rem; }
            
            th, td { padding: 0.6rem; font-size: 0.65rem; }
            
            .modal-content { padding: 1rem; width: 95%; }
        }

        /* Small Mobile */
        @media (max-width: 480px) {
            .content { padding: 0.6rem; padding-top: 4rem; }
            .hero-banner { padding: 0.8rem; }
            .hero-content h1 { font-size: 0.95rem; }
            .stats-rail { gap: 0.5rem; }
            .stat-pill { padding: 0.2rem 0.6rem; font-size: 0.6rem; }
            .tab-btn { padding: 0.3rem 0.8rem; font-size: 0.65rem; }
            .event-info { padding: 0.8rem; }
            .event-title { font-size: 0.85rem; }
            .certificate-card { padding: 1rem; }
            .certificate-card h3 { font-size: 0.85rem; }
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <button class="mobile-menu-toggle" id="mobileMenuToggle"><i class="fas fa-bars"></i></button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="dashboard-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="logo-icon"><i class="fas fa-code"></i></div>
                    <div class="logo-text"><h3>C3</h3><p>User Portal</p></div>
                </div>
                <div class="user-welcome" id="userWelcomeSidebar">
                    <p>Welcome back,</p>
                    <h4 id="sidebarUserName">User</h4>
                </div>
            </div>
            <button class="tablink active" data-tab="joined-events"><i class="fas fa-check-circle"></i> Joined Events</button>
            <button class="tablink" data-tab="all-events"><i class="fas fa-calendar-alt"></i> All Events</button>
            <button class="tablink" data-tab="notifications"><i class="fas fa-bell"></i> Notifications</button>
            <button class="tablink" data-tab="certificates"><i class="fas fa-certificate"></i> Certificates</button>
            <button class="tablink" data-tab="profile"><i class="fas fa-user-circle"></i> Profile</button>
            <button class="tablink" data-tab="login-history"><i class="fas fa-history"></i> Login History</button>
            <button class="tablink logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <div class="content">
            <div class="hero-banner">
                <div class="hero-content">
                    <h1 id="heroGreeting">Welcome back, <span id="heroUserName">Coder</span>! 👋</h1>
                    <p>Track your events, certificates, and activity</p>
                    <div class="stats-rail">
                        <div class="stat-pill"><i class="fas fa-calendar-check"></i> <span id="joinedCountHeader">0</span> Events</div>
                        <div class="stat-pill"><i class="fas fa-certificate"></i> <span id="certCountHeader">0</span> Certs</div>
                    </div>
                </div>
            </div>

            <div class="tab-nav">
                <button class="tab-btn active" data-tab="joined-events">📋 Joined</button>
                <button class="tab-btn" data-tab="all-events">📅 Events</button>
                <button class="tab-btn" data-tab="notifications">🔔 Notices</button>
                <button class="tab-btn" data-tab="certificates">🎓 Certs</button>
                <button class="tab-btn" data-tab="profile">👤 Profile</button>
                <button class="tab-btn" data-tab="login-history">📊 History</button>
            </div>

            <div id="joined-events" class="tabcontent active"><div id="joined-events-grid" class="events-grid"><div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading...</div></div></div>
            <div id="all-events" class="tabcontent"><div id="all-events-grid" class="events-grid"><div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading...</div></div></div>
            <div id="notifications" class="tabcontent"><div id="notifications-list" class="notifications-container"><div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading...</div></div></div>
            <div id="certificates" class="tabcontent"><div id="certificates-list" class="certificates-grid"><div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading...</div></div></div>
            <div id="profile" class="tabcontent"><div id="profile-content"><div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading...</div></div></div>
            <div id="login-history" class="tabcontent">
                <div class="table-container"><table><thead><tr><th>Login Time</th><th>Logout</th><th>Duration</th><th>Device</th><th>Browser</th><th>OS</th><th>IP</th></tr></thead><tbody id="loginHistoryBody"><tr><td colspan="7" class="loading">Loading...</td></tr></tbody></table></div>
            </div>
        </div>
    </div>

    <div id="eventModal" class="modal"><div class="modal-content"><span class="close-modal" onclick="closeModal()">&times;</span><h2 id="modalTitle"></h2><img id="modalImage" src="" alt="" style="width:100%; border-radius:14px; margin:0.8rem 0;"><p id="modalDate"></p><p id="modalLocation"></p><p id="modalDescription"></p><button class="btn" id="joinEventBtn" onclick="joinCurrentEvent()">Join Event</button></div></div>

    <script>
        const API_BASE_URL = 'https://backend-glo6.onrender.com';
        let currentEventId = null;
        const token = localStorage.getItem('jwtToken');
        if (!token) window.location.href = '/';

        const mobileToggle = document.getElementById('mobileMenuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('active'); }
        function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('active'); }
        if (mobileToggle) mobileToggle.addEventListener('click', (e) => { e.stopPropagation(); sidebar.classList.contains('open') ? closeSidebar() : openSidebar(); });
        if (overlay) overlay.addEventListener('click', closeSidebar);

        function switchTab(tabName) {
            document.querySelectorAll('.tabcontent').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.querySelector(`.tab-btn[data-tab="${tabName}"]`).classList.add('active');
            if (tabName === 'certificates') fetchCertificates();
            if (tabName === 'login-history') fetchLoginHistory();
            closeSidebar();
        }
        document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
        document.querySelectorAll('.tablink').forEach(link => link.addEventListener('click', () => { switchTab(link.dataset.tab); }));

        function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

        async function fetchAllEvents() {
            try {
                const res = await fetch(`${API_BASE_URL}/allevents`, { headers: { 'Authorization': `Bearer ${token}` } });
                const events = await res.json();
                document.getElementById('all-events-grid').innerHTML = events.length ? events.map(e => `
                    <div class="event-card" onclick="showEventDetails('${e._id}')">
                        <div class="event-img"><img src="${e.imagelink || 'https://via.placeholder.com/300x180'}" alt="${e.name}"><span class="event-badge">${e.isOpen ? 'Open' : 'Closed'}</span></div>
                        <div class="event-info"><h3 class="event-title">${escapeHtml(e.name)}</h3><div class="event-date"><i class="far fa-calendar-alt"></i> ${new Date(e.date).toLocaleDateString()}</div><div class="event-location"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(e.location || 'TBA')}</div></div>
                    </div>
                `).join('') : '<div class="empty-state">No events available</div>';
            } catch (error) { document.getElementById('all-events-grid').innerHTML = '<div class="empty-state">Failed to load events</div>'; }
        }

        async function fetchJoinedEvents() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/user/events`, { headers: { 'Authorization': `Bearer ${token}` } });
                const events = await res.json();
                document.getElementById('joinedCountHeader').textContent = events.length;
                document.getElementById('joined-events-grid').innerHTML = events.length ? events.map(e => `
                    <div class="event-card" onclick="showEventDetails('${e.eventId?._id || e.eventId}')">
                        <div class="event-img"><img src="${e.eventImage || e.eventId?.imagelink || 'https://via.placeholder.com/300x180'}" alt="${e.eventName}"><span class="event-badge">Joined</span></div>
                        <div class="event-info"><h3 class="event-title">${escapeHtml(e.eventName)}</h3><div class="event-date"><i class="far fa-calendar-alt"></i> Joined on ${new Date(e.joinedAt).toLocaleDateString()}</div></div>
                    </div>
                `).join('') : '<div class="empty-state">No joined events yet</div>';
            } catch (error) { document.getElementById('joined-events-grid').innerHTML = '<div class="empty-state">No joined events yet</div>'; }
        }

        async function fetchNotifications() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/notifications`);
                const notifications = await res.json();
                document.getElementById('notifications-list').innerHTML = notifications.length ? notifications.map(n => `
                    <div class="notification-card"><div class="notification-title">${escapeHtml(n.title)}</div><div class="notification-date">${new Date(n.date).toLocaleDateString()}</div><div>${escapeHtml(n.message.substring(0, 120))}${n.message.length > 120 ? '...' : ''}</div></div>
                `).join('') : '<div class="empty-state">No notifications yet</div>';
            } catch (error) { document.getElementById('notifications-list').innerHTML = '<div class="empty-state">No notifications</div>'; }
        }

        async function fetchProfile() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/user/profile`, { headers: { 'Authorization': `Bearer ${token}` } });
                const user = await res.json();
                document.getElementById('sidebarUserName').innerHTML = user.name.split(' ')[0];
                document.getElementById('heroUserName').innerHTML = user.name.split(' ')[0];
                document.getElementById('profile-content').innerHTML = `
                    <div class="profile-card">
                        <div class="profile-cover"></div>
                        <div class="profile-avatar"><i class="fas fa-user"></i></div>
                        <div class="profile-info"><h2>${escapeHtml(user.name)}</h2><p class="email">${escapeHtml(user.email)}</p>
                            <div class="profile-stats-grid">
                                <div class="profile-stat-item"><div class="value">${user.events?.length || 0}</div><div class="label">Events</div></div>
                                <div class="profile-stat-item"><div class="value">${user.isverified ? '✓' : '⏳'}</div><div class="label">Verified</div></div>
                                <div class="profile-stat-item"><div class="value">${user.batch || '-'}</div><div class="label">Batch</div></div>
                            </div>
                        </div>
                        <div class="profile-details-grid">
                            <div class="profile-detail-item"><i class="fas fa-graduation-cap"></i><div><div class="detail-label">Branch</div><div class="detail-value">${escapeHtml(user.branch)}</div></div></div>
                            <div class="profile-detail-item"><i class="fas fa-hashtag"></i><div><div class="detail-label">Roll No</div><div class="detail-value">${escapeHtml(user.rollno || '-')}</div></div></div>
                            <div class="profile-detail-item"><i class="fas fa-id-card"></i><div><div class="detail-label">Reg No</div><div class="detail-value">${escapeHtml(user.regno || '-')}</div></div></div>
                            <div class="profile-detail-item"><i class="fas fa-phone"></i><div><div class="detail-label">Mobile</div><div class="detail-value">${escapeHtml(user.mobileno)}</div></div></div>
                            <div class="profile-detail-item"><i class="fas fa-calendar"></i><div><div class="detail-label">Member Since</div><div class="detail-value">${new Date(user.createdAt).toLocaleDateString()}</div></div></div>
                        </div>
                    </div>
                `;
            } catch (error) { document.getElementById('profile-content').innerHTML = '<div class="empty-state">Failed to load profile</div>'; }
        }

        async function fetchCertificates() {
            const container = document.getElementById('certificates-list');
            container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
            try {
                const userRes = await fetch(`${API_BASE_URL}/api/user/profile`, { headers: { 'Authorization': `Bearer ${token}` } });
                const user = await userRes.json();
                const identifier = user.rollno || user.regno;
                if (!identifier) { container.innerHTML = '<div class="empty-state">No roll number found</div>'; document.getElementById('certCountHeader').textContent = '0'; return; }
                const res = await fetch(`${API_BASE_URL}/api/certificates/user/${identifier}`, { headers: { 'Authorization': `Bearer ${token}` } });
                const certificates = await res.json();
                document.getElementById('certCountHeader').textContent = certificates.length;
                container.innerHTML = certificates.length ? certificates.map(c => `
                    <div class="certificate-card"><div class="certificate-icon"><i class="fas fa-certificate"></i></div><h3>${escapeHtml(c.title)}</h3>${c.eventName ? `<p><i class="fas fa-calendar-alt"></i> ${escapeHtml(c.eventName)}</p>` : ''}<p><small>Issued: ${new Date(c.issuedDate).toLocaleDateString()}</small></p><button class="btn" onclick="downloadCert('${c.pdfUrl}', '${escapeHtml(c.title)}.pdf')"><i class="fas fa-download"></i> Download</button></div>
                `).join('') : '<div class="empty-state">No certificates found</div>';
            } catch (error) { container.innerHTML = '<div class="empty-state">Failed to load certificates</div>'; }
        }

        async function downloadCert(url, filename) {
            const btn = event.currentTarget;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>...';
            btn.disabled = true;
            try {
                const res = await fetch(url);
                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                a.click();
                URL.revokeObjectURL(a.href);
            } catch (error) { window.open(url, '_blank'); }
            btn.innerHTML = '<i class="fas fa-download"></i> Download';
            btn.disabled = false;
        }

        async function showEventDetails(id) {
            currentEventId = id;
            try {
                const res = await fetch(`${API_BASE_URL}/api/events/${id}`, { headers: { 'Authorization': `Bearer ${token}` } });
                const e = await res.json();
                document.getElementById('modalTitle').textContent = e.name;
                document.getElementById('modalImage').src = e.imagelink;
                document.getElementById('modalDate').innerHTML = `<i class="far fa-calendar-alt"></i> ${new Date(e.date).toLocaleDateString()}`;
                document.getElementById('modalLocation').innerHTML = `<i class="fas fa-map-marker-alt"></i> ${e.location}`;
                document.getElementById('modalDescription').textContent = e.description;
                document.getElementById('eventModal').classList.add('active');
            } catch (error) { alert('Failed to load event'); }
        }

        async function joinCurrentEvent() {
            if (!currentEventId) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/events/${currentEventId}/join`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } });
                const data = await res.json();
                if (res.ok) { alert('Successfully joined the event!'); closeModal(); fetchJoinedEvents(); }
                else { alert(data.message || 'Failed to join'); }
            } catch (error) { alert('Error joining event'); }
        }

        async function fetchLoginHistory() {
            const tbody = document.getElementById('loginHistoryBody');
            tbody.innerHTML = '<tr><td colspan="7" class="loading">Loading...<\/td><\/tr>';
            try {
                const res = await fetch(`${API_BASE_URL}/api/login-history/my`, { headers: { 'Authorization': `Bearer ${token}` } });
                const history = await res.json();
                if (!history.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No login history found<\/td><\/tr>'; return; }
                tbody.innerHTML = history.map(log => `<tr><td>${new Date(log.loginTime).toLocaleString()}</td><td>${log.logoutTime ? new Date(log.logoutTime).toLocaleString() : '<span class="online-badge">● Online</span>'}</td><td>${log.sessionDuration ? Math.floor(log.sessionDuration / 60) + 'm ' + (log.sessionDuration % 60) + 's' : '-'}</td><td>${escapeHtml(log.device || 'Unknown')}</td><td>${escapeHtml(log.browser || 'Unknown')}</td><td>${escapeHtml(log.os || 'Unknown')}</td><td>${escapeHtml(log.ipAddress || 'Unknown')}</td></tr>`).join('');
            } catch (error) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Failed to load<\/td><\/tr>'; }
        }

        function closeModal() { document.getElementById('eventModal').classList.remove('active'); currentEventId = null; }
        function logout() { localStorage.removeItem('jwtToken'); localStorage.removeItem('user'); window.location.href = '/'; }

        fetchAllEvents();
        fetchJoinedEvents();
        fetchNotifications();
        fetchProfile();
    </script>
</body>
</html>
