<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>User Dashboard - C3 Community</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00f0ff;
            --primary-dark: #00cce0;
            --secondary: #ff2d75;
            --secondary-dark: #e6005c;
            --accent: #f0ff00;
            --text: #ffffff;
            --text-dark: #1a1a2e;
            --text-secondary: #a0a0b0;
            --bg: #0a0e17;
            --bg-light: #111827;
            --card-bg: rgba(26, 31, 45, 0.8);
            --card-bg-solid: #1a1f2d;
            --glass-bg: rgba(26, 31, 45, 0.6);
            --glass-border: rgba(0, 240, 255, 0.2);
            --nav-bg: rgba(10, 14, 23, 0.95);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gradient-1: linear-gradient(135deg, #00f0ff 0%, #ff2d75 100%);
            --gradient-2: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-3: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.2);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 20px rgba(0, 240, 255, 0.3);
            --border-radius-sm: 12px;
            --border-radius-md: 16px;
            --border-radius-lg: 24px;
            --border-radius-xl: 32px;
        }

        [data-theme="light"] {
            --primary: #0066ff;
            --primary-dark: #0052cc;
            --secondary: #ff3366;
            --secondary-dark: #e6004d;
            --text: #1a1a2e;
            --text-dark: #ffffff;
            --text-secondary: #666666;
            --bg: #f0f4ff;
            --bg-light: #e8edf5;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-bg-solid: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 102, 255, 0.2);
            --nav-bg: rgba(255, 255, 255, 0.95);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Animated Background */
        .dashboard-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
            pointer-events: none;
        }

        .dashboard-bg::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            top: 10%;
            left: -100px;
            border-radius: 50%;
            filter: blur(80px);
            animation: float 20s ease-in-out infinite;
        }

        .dashboard-bg::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
            bottom: 10%;
            right: -100px;
            border-radius: 50%;
            filter: blur(100px);
            animation: float 25s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-30px) translateX(20px); }
        }

        /* Dashboard Container */
        .dashboard-container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .sidebar-header {
            padding: 2rem 1.5rem 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            text-align: center;
            margin-bottom: 1rem;
        }

        .sidebar-header .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 1rem;
            background: var(--gradient-1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.4); }
            50% { box-shadow: 0 0 0 15px rgba(0, 240, 255, 0); }
        }

        .sidebar-header .logo i {
            font-size: 2rem;
            color: white;
        }

        .sidebar-header h3 {
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-header p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .tablink {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            padding: 0.9rem 1.5rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .tablink i {
            width: 24px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .tablink:hover {
            color: var(--primary);
            background: rgba(0, 240, 255, 0.08);
            padding-left: 2rem;
        }

        .tablink.active {
            color: var(--primary);
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.15), transparent);
        }

        .tablink.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            background: var(--primary);
            border-radius: 0 3px 3px 0;
        }

        .logout-btn {
            margin-top: 2rem;
            border-top: 1px solid var(--glass-border);
            border-bottom: none;
            color: var(--danger);
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        /* Main Content */
        .content {
            flex: 1;
            margin-left: 280px;
            padding: 2rem;
            transition: all 0.4s ease;
        }

        /* Welcome Header */
        .welcome-header {
            background: var(--gradient-1);
            border-radius: var(--border-radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .welcome-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            border-radius: 50%;
        }

        .welcome-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .welcome-header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .stats-mini {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .stat-mini {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.15);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        .stat-mini i {
            font-size: 1rem;
        }

        /* Section Title */
        .section-title {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .section-title h2 {
            font-size: 1.6rem;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 0.5rem;
            background: var(--card-bg);
            padding: 0.5rem;
            border-radius: 60px;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .tab-btn {
            padding: 0.7rem 1.5rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 50px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--primary);
        }

        .tab-btn.active {
            background: var(--gradient-1);
            color: white;
            box-shadow: var(--shadow-glow);
        }

        .tabcontent {
            display: none;
            animation: fadeInUp 0.4s ease;
        }

        .tabcontent.active {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Event Cards */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .event-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius-md);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--glass-border);
            cursor: pointer;
        }

        .event-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: var(--shadow-xl), var(--shadow-glow);
        }

        .event-img {
            position: relative;
            height: 200px;
            overflow: hidden;
        }

        .event-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .event-card:hover .event-img img {
            transform: scale(1.1);
        }

        .event-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--gradient-1);
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .event-info {
            padding: 1.2rem;
        }

        .event-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .event-date, .event-location {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin: 0.4rem 0;
        }

        /* Profile Section */
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        .profile-cover {
            height: 120px;
            background: var(--gradient-1);
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            background: var(--card-bg-solid);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -50px auto 1rem;
            border: 4px solid var(--primary);
            box-shadow: var(--shadow-lg);
        }

        .profile-avatar i {
            font-size: 3rem;
            color: var(--primary);
        }

        .profile-info {
            text-align: center;
            padding: 0 1.5rem 1.5rem;
        }

        .profile-info h2 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .profile-info .email {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .profile-stat {
            text-align: center;
            padding: 1rem;
            background: rgba(0, 240, 255, 0.05);
            border-radius: var(--border-radius-sm);
        }

        .profile-stat .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        .profile-stat .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .profile-details {
            padding: 1.5rem;
            border-top: 1px solid var(--glass-border);
        }

        .profile-field {
            display: flex;
            padding: 0.8rem 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .profile-field:last-child {
            border-bottom: none;
        }

        .field-label {
            width: 140px;
            font-weight: 600;
            color: var(--primary);
        }

        /* Table Styles */
        .table-container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius-md);
            overflow-x: auto;
            border: 1px solid var(--glass-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.85rem;
        }

        th {
            background: rgba(0, 240, 255, 0.08);
            color: var(--primary);
            font-weight: 600;
        }

        /* Certificate Cards */
        .certificates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .certificate-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius-md);
            padding: 1.5rem;
            text-align: center;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .certificate-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
        }

        .certificate-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        /* Notification Cards */
        .notifications-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .notification-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-radius: var(--border-radius-sm);
            border-left: 3px solid var(--primary);
            transition: all 0.3s ease;
        }

        .notification-card:hover {
            transform: translateX(5px);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg-solid);
            border-radius: var(--border-radius-lg);
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .close-modal {
            float: right;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            color: var(--danger);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.5rem;
            background: var(--gradient-1);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .online-badge {
            color: var(--success);
            font-weight: 600;
        }

        /* Loading States */
        .loading-spinner {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .no-data {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        /* Mobile Menu Toggle */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 101;
            background: var(--gradient-1);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: var(--shadow-md);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 99;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .mobile-menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .sidebar {
                transform: translateX(-100%);
                position: fixed;
                width: 280px;
                z-index: 102;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.active {
                display: block;
            }

            .content {
                margin-left: 0;
                padding: 1.5rem;
                padding-top: 5rem;
            }
        }

        @media (max-width: 768px) {
            .welcome-header h1 {
                font-size: 1.3rem;
            }

            .section-title {
                flex-direction: column;
                align-items: flex-start;
            }

            .section-title h2 {
                font-size: 1.3rem;
            }

            .tab-nav {
                overflow-x: auto;
                flex-wrap: nowrap;
                border-radius: 12px;
            }

            .tab-btn {
                white-space: nowrap;
                padding: 0.5rem 1.2rem;
                font-size: 0.85rem;
            }

            .stats-mini {
                flex-wrap: wrap;
            }

            .profile-stats {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }

            .profile-field {
                flex-direction: column;
                gap: 0.3rem;
            }

            .field-label {
                width: 100%;
            }

            .events-grid, .certificates-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .content {
                padding: 1rem;
                padding-top: 5rem;
            }

            .welcome-header {
                padding: 1.2rem;
            }

            .welcome-header h1 {
                font-size: 1.1rem;
            }

            .stat-mini {
                font-size: 0.75rem;
                padding: 0.3rem 0.8rem;
            }

            .modal-content {
                padding: 1.2rem;
            }
        }
    </style>
</head>

<body>
    <button class="mobile-menu-toggle" id="mobileMenuToggle"><i class="fas fa-bars"></i></button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="dashboard-bg"></div>

    <div class="dashboard-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-code"></i>
                </div>
                <h3>C3 Dashboard</h3>
                <p id="userNameDisplay">Welcome, User</p>
            </div>
            <button class="tablink active" data-tab="joined-events">
                <i class="fas fa-check-circle"></i> Joined Events
            </button>
            <button class="tablink" data-tab="all-events">
                <i class="fas fa-calendar-alt"></i> All Events
            </button>
            <button class="tablink" data-tab="notifications">
                <i class="fas fa-bell"></i> Notifications
            </button>
            <button class="tablink" data-tab="certificates">
                <i class="fas fa-certificate"></i> Certificates
            </button>
            <button class="tablink" data-tab="profile">
                <i class="fas fa-user-circle"></i> Profile
            </button>
            <button class="tablink" data-tab="login-history">
                <i class="fas fa-history"></i> Login History
            </button>
            <button class="tablink logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <div class="content">
            <div class="welcome-header">
                <h1 id="welcomeMessage">Welcome back!</h1>
                <p>Track your events, certificates, and activity all in one place</p>
                <div class="stats-mini" id="miniStats">
                    <div class="stat-mini"><i class="fas fa-calendar-check"></i> <span id="joinedCount">0</span> Events Joined</div>
                    <div class="stat-mini"><i class="fas fa-certificate"></i> <span id="certCount">0</span> Certificates</div>
                </div>
            </div>

            <div class="tab-nav">
                <button class="tab-btn active" data-tab="joined-events">📋 Joined Events</button>
                <button class="tab-btn" data-tab="all-events">📅 All Events</button>
                <button class="tab-btn" data-tab="notifications">🔔 Notifications</button>
                <button class="tab-btn" data-tab="certificates">🎓 Certificates</button>
                <button class="tab-btn" data-tab="profile">👤 Profile</button>
                <button class="tab-btn" data-tab="login-history">📊 Login History</button>
            </div>

            <div id="joined-events" class="tabcontent active">
                <div id="joined-events-grid" class="events-grid">
                    <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
                </div>
            </div>

            <div id="all-events" class="tabcontent">
                <div id="all-events-grid" class="events-grid">
                    <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
                </div>
            </div>

            <div id="notifications" class="tabcontent">
                <div id="notifications-list" class="notifications-container">
                    <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
                </div>
            </div>

            <div id="certificates" class="tabcontent">
                <div id="certificates-list" class="certificates-grid">
                    <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
                </div>
            </div>

            <div id="profile" class="tabcontent">
                <div id="profile-content">
                    <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
                </div>
            </div>

            <div id="login-history" class="tabcontent">
                <div class="table-container">
                    </table>
                        <thead>
                            <tr><th>Login Time</th><th>Logout Time</th><th>Duration</th><th>Device</th><th>Browser</th><th>OS</th><th>IP</th></tr>
                        </thead>
                        <tbody id="loginHistoryBody"><tr><td colspan="7" class="loading">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="eventModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle"></h2>
            <img id="modalImage" src="" alt="" style="width:100%; border-radius:12px; margin:1rem 0;">
            <p id="modalDate"></p>
            <p id="modalLocation"></p>
            <p id="modalDescription"></p>
            <button class="btn" id="joinEventBtn" onclick="joinCurrentEvent()">Join Event</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://backend-glo6.onrender.com';
        let currentEventId = null;

        const token = localStorage.getItem('jwtToken');
        if (!token) window.location.href = '/';

        // Mobile menu
        const mobileToggle = document.getElementById('mobileMenuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }

        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        }

        if (mobileToggle) {
            mobileToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                if (sidebar.classList.contains('open')) closeSidebar();
                else openSidebar();
            });
        }
        if (overlay) overlay.addEventListener('click', closeSidebar);

        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tabcontent').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.querySelector(`.tab-btn[data-tab="${tabName}"]`).classList.add('active');

            if (tabName === 'certificates') fetchCertificates();
            if (tabName === 'login-history') fetchLoginHistory();
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        document.querySelectorAll('.tablink').forEach(link => {
            link.addEventListener('click', () => {
                const tabName = link.dataset.tab;
                switchTab(tabName);
                closeSidebar();
            });
        });

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function fetchAllEvents() {
            try {
                const response = await fetch(`${API_BASE_URL}/allevents`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error();
                const events = await response.json();
                displayEvents(events, 'all-events-grid');
            } catch (error) {
                document.getElementById('all-events-grid').innerHTML = '<div class="no-data">Failed to load events</div>';
            }
        }

        async function fetchJoinedEvents() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/user/events`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error();
                const events = await response.json();
                displayJoinedEvents(events);
                document.getElementById('joinedCount').textContent = events.length || 0;
                return events;
            } catch (error) {
                document.getElementById('joined-events-grid').innerHTML = '<div class="no-data">No joined events yet</div>';
            }
        }

        function displayEvents(events, containerId) {
            const container = document.getElementById(containerId);
            if (!events || events.length === 0) {
                container.innerHTML = '<div class="no-data">No events available</div>';
                return;
            }
            container.innerHTML = events.map(event => `
                <div class="event-card" onclick="showEventDetails('${event._id}')">
                    <div class="event-img">
                        <img src="${event.imagelink || 'https://via.placeholder.com/300x180'}" alt="${escapeHtml(event.name)}">
                        <span class="event-badge">${event.isOpen ? 'Open' : 'Closed'}</span>
                    </div>
                    <div class="event-info">
                        <h3 class="event-title">${escapeHtml(event.name)}</h3>
                        <div class="event-date"><i class="far fa-calendar-alt"></i> ${new Date(event.date).toLocaleDateString()}</div>
                        <div class="event-location"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(event.location || 'TBA')}</div>
                    </div>
                </div>
            `).join('');
        }

        function displayJoinedEvents(events) {
            const container = document.getElementById('joined-events-grid');
            if (!events || events.length === 0) {
                container.innerHTML = '<div class="no-data">You haven\'t joined any events yet</div>';
                return;
            }
            container.innerHTML = events.map(event => `
                <div class="event-card" onclick="showEventDetails('${event.eventId?._id || event.eventId}')">
                    <div class="event-img">
                        <img src="${event.eventImage || event.eventId?.imagelink || 'https://via.placeholder.com/300x180'}" alt="${escapeHtml(event.eventName)}">
                        <span class="event-badge">Joined</span>
                    </div>
                    <div class="event-info">
                        <h3 class="event-title">${escapeHtml(event.eventName)}</h3>
                        <div class="event-date"><i class="far fa-calendar-alt"></i> Joined on ${new Date(event.joinedAt).toLocaleDateString()}</div>
                    </div>
                </div>
            `).join('');
        }

        async function fetchNotifications() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/notifications`);
                if (!response.ok) throw new Error();
                const notifications = await response.json();
                const container = document.getElementById('notifications-list');
                if (!notifications.length) {
                    container.innerHTML = '<div class="no-data">No notifications yet</div>';
                    return;
                }
                container.innerHTML = notifications.map(n => `
                    <div class="notification-card">
                        <div class="notification-title">${escapeHtml(n.title)}</div>
                        <div class="notification-date">${new Date(n.date).toLocaleDateString()}</div>
                        <div>${escapeHtml(n.message.substring(0, 150))}${n.message.length > 150 ? '...' : ''}</div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('notifications-list').innerHTML = '<div class="no-data">No notifications</div>';
            }
        }

        async function fetchProfile() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/user/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error();
                const user = await response.json();
                document.getElementById('userNameDisplay').innerHTML = `Hi, ${user.name.split(' ')[0]}`;
                document.getElementById('welcomeMessage').innerHTML = `Welcome back, ${user.name}! 👋`;
                document.getElementById('profile-content').innerHTML = `
                    <div class="profile-card">
                        <div class="profile-cover"></div>
                        <div class="profile-avatar"><i class="fas fa-user"></i></div>
                        <div class="profile-info">
                            <h2>${escapeHtml(user.name)}</h2>
                            <p class="email">${escapeHtml(user.email)}</p>
                            <div class="profile-stats">
                                <div class="profile-stat"><div class="value">${user.events?.length || 0}</div><div class="label">Events Joined</div></div>
                                <div class="profile-stat"><div class="value">${user.isverified ? '✓' : '⏳'}</div><div class="label">Verified</div></div>
                                <div class="profile-stat"><div class="value">${user.batch || '-'}</div><div class="label">Batch</div></div>
                            </div>
                        </div>
                        <div class="profile-details">
                            <div class="profile-field"><div class="field-label"><i class="fas fa-graduation-cap"></i> Branch</div><div>${escapeHtml(user.branch)}</div></div>
                            <div class="profile-field"><div class="field-label"><i class="fas fa-hashtag"></i> Roll No</div><div>${escapeHtml(user.rollno || '-')}</div></div>
                            <div class="profile-field"><div class="field-label"><i class="fas fa-id-card"></i> Reg No</div><div>${escapeHtml(user.regno || '-')}</div></div>
                            <div class="profile-field"><div class="field-label"><i class="fas fa-phone"></i> Mobile</div><div>${escapeHtml(user.mobileno)}</div></div>
                            <div class="profile-field"><div class="field-label"><i class="fas fa-calendar"></i> Member Since</div><div>${new Date(user.createdAt).toLocaleDateString()}</div></div>
                        </div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('profile-content').innerHTML = '<div class="no-data">Failed to load profile</div>';
            }
        }

        async function fetchCertificates() {
            const container = document.getElementById('certificates-list');
            container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
            try {
                const userRes = await fetch(`${API_BASE_URL}/api/user/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const user = await userRes.json();
                const identifier = user.rollno || user.regno;
                if (!identifier) {
                    container.innerHTML = '<div class="no-data">No roll number found</div>';
                    document.getElementById('certCount').textContent = '0';
                    return;
                }
                const response = await fetch(`${API_BASE_URL}/api/certificates/user/${identifier}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const certificates = await response.json();
                document.getElementById('certCount').textContent = certificates.length || 0;
                if (!certificates.length) {
                    container.innerHTML = '<div class="no-data">No certificates found</div>';
                    return;
                }
                container.innerHTML = certificates.map(cert => `
                    <div class="certificate-card">
                        <div class="certificate-icon"><i class="fas fa-certificate"></i></div>
                        <h3>${escapeHtml(cert.title)}</h3>
                        ${cert.eventName ? `<p><i class="fas fa-calendar-alt"></i> ${escapeHtml(cert.eventName)}</p>` : ''}
                        <p><small>Issued: ${new Date(cert.issuedDate).toLocaleDateString()}</small></p>
                        <button class="btn" onclick="downloadCert('${cert.pdfUrl}', '${escapeHtml(cert.title)}.pdf')"><i class="fas fa-download"></i> Download</button>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<div class="no-data">Failed to load certificates</div>';
            }
        }

        async function downloadCert(url, filename) {
            const btn = event.currentTarget;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Downloading...';
            btn.disabled = true;
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                a.click();
                URL.revokeObjectURL(a.href);
            } catch (error) {
                window.open(url, '_blank');
            }
            btn.innerHTML = '<i class="fas fa-download"></i> Download';
            btn.disabled = false;
        }

        async function showEventDetails(eventId) {
            currentEventId = eventId;
            try {
                const response = await fetch(`${API_BASE_URL}/api/events/${eventId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const event = await response.json();
                document.getElementById('modalTitle').textContent = event.name;
                document.getElementById('modalImage').src = event.imagelink;
                document.getElementById('modalDate').innerHTML = `<i class="far fa-calendar-alt"></i> ${new Date(event.date).toLocaleDateString()}`;
                document.getElementById('modalLocation').innerHTML = `<i class="fas fa-map-marker-alt"></i> ${event.location}`;
                document.getElementById('modalDescription').textContent = event.description;
                document.getElementById('eventModal').classList.add('active');
            } catch (error) {
                alert('Failed to load event');
            }
        }

        async function joinCurrentEvent() {
            if (!currentEventId) return;
            try {
                const response = await fetch(`${API_BASE_URL}/api/events/${currentEventId}/join`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                if (response.ok) {
                    alert('Successfully joined the event!');
                    closeModal();
                    fetchJoinedEvents();
                } else {
                    alert(data.message || 'Failed to join');
                }
            } catch (error) {
                alert('Error joining event');
            }
        }

        async function fetchLoginHistory() {
            const tbody = document.getElementById('loginHistoryBody');
            tbody.innerHTML = '<tr><td colspan="7" class="loading">Loading...<\/td><\/tr>';
            try {
                const response = await fetch(`${API_BASE_URL}/api/login-history/my`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const history = await response.json();
                if (!history.length) {
                    tbody.innerHTML = '<tr><td colspan="7" class="no-data">No login history found<\/td><\/tr>';
                    return;
                }
                tbody.innerHTML = history.map(log => `
                    <tr>
                        <td>${new Date(log.loginTime).toLocaleString()}<\/td>
                        <td>${log.logoutTime ? new Date(log.logoutTime).toLocaleString() : '<span class="online-badge">● Online</span>'}<\/td>
                        <td>${log.sessionDuration ? Math.floor(log.sessionDuration / 60) + 'm ' + (log.sessionDuration % 60) + 's' : '-'}<\/td>
                        <td>${escapeHtml(log.device || 'Unknown')}<\/td>
                        <td>${escapeHtml(log.browser || 'Unknown')}<\/td>
                        <td>${escapeHtml(log.os || 'Unknown')}<\/td>
                        <td>${escapeHtml(log.ipAddress || 'Unknown')}<\/td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = '</table><td colspan="7" class="loading">Failed to load<\/td><\/tr>';
            }
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
            currentEventId = null;
        }

        function logout() {
            localStorage.removeItem('jwtToken');
            localStorage.removeItem('user');
            window.location.href = '/';
        }

        // Initialize
        fetchAllEvents();
        fetchJoinedEvents();
        fetchNotifications();
        fetchProfile();
    </script>
</body>
</html>
