<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form - C3 Community</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <style>
        .form-fill-page {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .form-fill-container {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid var(--border);
        }
        .form-title {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--primary);
        }
        .form-description {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }
        .form-field {
            margin-bottom: 25px;
        }
        .form-field label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .form-field .required-star {
            color: var(--danger);
        }
        .form-field .help-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        .form-field input,
        .form-field select,
        .form-field textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
        }
        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-field .radio-options,
        .form-field .checkbox-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-field .radio-options label,
        .form-field .checkbox-options label {
            font-weight: 400;
            cursor: pointer;
        }
        .form-field .radio-options input,
        .form-field .checkbox-options input {
            width: auto;
            margin-right: 8px;
        }
        .btn-submit {
            padding: 14px 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.3);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-message {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 5px;
        }
        .success-message {
            text-align: center;
            padding: 40px;
        }
        .success-message i {
            font-size: 4rem;
            color: var(--success);
        }
        @media (max-width: 768px) {
            .form-fill-container { padding: 20px; }
            .form-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="assets/img/logowithoutname.png" alt="logo">
                <h1>Creative Coding Community</h1>
            </a>
        </nav>
    </header>

    <main class="form-fill-page">
        <div class="form-fill-container">
            <div id="formContent">
                <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading form...</div>
            </div>
        </div>
    </main>

    <script src="main.js"></script>
    <script>
        const API_BASE_URL = 'https://backend-glo6.onrender.com';
        
        // Get form ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const formId = urlParams.get('id');

        if (!formId) {
            document.getElementById('formContent').innerHTML = '<div class="empty-state">No form ID provided</div>';
        } else {
            loadForm(formId);
        }

        async function loadForm(id) {
            const container = document.getElementById('formContent');
            container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading form...</div>';

            try {
                const response = await fetch(`${API_BASE_URL}/api/public/forms/${id}`);
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.message || 'Form not found');
                }

                const form = await response.json();
                renderForm(form);
            } catch (error) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle" style="font-size:3rem;"></i>
                        <p>${error.message}</p>
                        <button onclick="window.location.href='index.html'" style="margin-top:15px;padding:10px 30px;background:var(--primary);border:none;border-radius:8px;color:white;cursor:pointer;">
                            Go Back Home
                        </button>
                    </div>
                `;
            }
        }

        function renderForm(form) {
            const container = document.getElementById('formContent');
            
            let html = `
                <h1 class="form-title">${escapeHtml(form.title)}</h1>
                ${form.description ? `<p class="form-description">${escapeHtml(form.description)}</p>` : ''}
                <form id="fillForm" onsubmit="submitForm(event, '${form._id}')">
            `;

            form.fields.forEach(field => {
                html += `
                    <div class="form-field" id="field-${field.id}">
                        <label>
                            ${escapeHtml(field.label)}
                            ${field.required ? '<span class="required-star">*</span>' : ''}
                        </label>
                        ${field.helpText ? `<div class="help-text">${escapeHtml(field.helpText)}</div>` : ''}
                        ${getFieldHTML(field)}
                        <div class="error-message" id="error-${field.id}"></div>
                    </div>
                `;
            });

            html += `
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i class="fas fa-paper-plane"></i> Submit
                    </button>
                </form>
            `;

            container.innerHTML = html;
        }

        function getFieldHTML(field) {
            const name = field.id;
            switch(field.type) {
                case 'text':
                case 'email':
                case 'number':
                case 'phone':
                case 'url':
                    return `<input type="${field.type}" name="${name}" placeholder="${escapeHtml(field.placeholder)}" ${field.required ? 'required' : ''}>`;
                case 'textarea':
                    return `<textarea name="${name}" placeholder="${escapeHtml(field.placeholder)}" ${field.required ? 'required' : ''} rows="4"></textarea>`;
                case 'select':
                    return `
                        <select name="${name}" ${field.required ? 'required' : ''}>
                            <option value="">Select...</option>
                            ${field.options.map(opt => `<option value="${escapeHtml(opt)}">${escapeHtml(opt)}</option>`).join('')}
                        </select>
                    `;
                case 'radio':
                    return `
                        <div class="radio-options">
                            ${field.options.map(opt => `
                                <label>
                                    <input type="radio" name="${name}" value="${escapeHtml(opt)}" ${field.required ? 'required' : ''}>
                                    ${escapeHtml(opt)}
                                </label>
                            `).join('')}
                        </div>
                    `;
                case 'checkbox':
                    return `
                        <div class="checkbox-options">
                            <label>
                                <input type="checkbox" name="${name}" ${field.required ? 'required' : ''}>
                                ${escapeHtml(field.label)}
                            </label>
                        </div>
                    `;
                case 'date':
                    return `<input type="date" name="${name}" ${field.required ? 'required' : ''}>`;
                case 'time':
                    return `<input type="time" name="${name}" ${field.required ? 'required' : ''}>`;
                case 'datetime':
                    return `<input type="datetime-local" name="${name}" ${field.required ? 'required' : ''}>`;
                case 'file':
                    return `<input type="file" name="${name}" ${field.required ? 'required' : ''}>`;
                case 'image':
                    return `<input type="file" accept="image/*" name="${name}" ${field.required ? 'required' : ''}>`;
                case 'rating':
                    return `
                        <div style="display:flex;gap:8px;font-size:28px;">
                            ${[1,2,3,4,5].map(i => `
                                <label style="cursor:pointer;transition:transform 0.2s;">
                                    <input type="radio" name="${name}" value="${i}" style="display:none;" ${field.required ? 'required' : ''}>
                                    <span onclick="this.previousElementSibling.checked=true;updateRating(this)">⭐</span>
                                </label>
                            `).join('')}
                        </div>
                    `;
                case 'slider':
                    return `<input type="range" name="${name}" min="0" max="100" ${field.required ? 'required' : ''}>`;
                case 'toggle':
                    return `
                        <label style="display:flex;align-items:center;gap:10px;">
                            <input type="checkbox" name="${name}" ${field.required ? 'required' : ''}>
                            <span>Toggle</span>
                        </label>
                    `;
                case 'color':
                    return `<input type="color" name="${name}" ${field.required ? 'required' : ''}>`;
                case 'section':
                    return `<div style="border-bottom:2px solid var(--primary);padding:10px 0;margin:10px 0;"><h3 style="color:var(--primary);">${escapeHtml(field.label)}</h3></div>`;
                case 'html':
                    return `<div style="padding:10px;background:var(--bg);border-radius:8px;">${field.defaultValue || ''}</div>`;
                default:
                    return `<input type="text" name="${name}" placeholder="${escapeHtml(field.placeholder)}" ${field.required ? 'required' : ''}>`;
            }
        }

        function updateRating(el) {
            const parent = el.parentElement.parentElement;
            const stars = parent.querySelectorAll('span');
            const value = parseInt(el.previousElementSibling.value);
            stars.forEach((star, index) => {
                star.style.opacity = index < value ? '1' : '0.3';
                star.style.transform = index < value ? 'scale(1.1)' : 'scale(1)';
            });
        }

        async function submitForm(e, formId) {
            e.preventDefault();
            const form = document.getElementById('fillForm');
            const formData = new FormData(form);
            const responses = {};
            let email = '';

            formData.forEach((value, key) => {
                if (key === 'email') {
                    email = value;
                }
                if (!key.startsWith('field_')) return;
                responses[key] = value;
            });

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

            try {
                const response = await fetch(`${API_BASE_URL}/api/public/forms/${formId}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ responses, email })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('formContent').innerHTML = `
                        <div class="success-message">
                            <i class="fas fa-check-circle"></i>
                            <h2>${data.confirmationMessage || 'Thank you!'}</h2>
                            <p>Your response has been recorded.</p>
                            <button onclick="window.location.href='index.html'" style="margin-top:20px;padding:10px 30px;background:var(--primary);border:none;border-radius:8px;color:white;cursor:pointer;">
                                Go Back Home
                            </button>
                        </div>
                    `;
                } else {
                    alert('❌ ' + data.message);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit';
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit';
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
